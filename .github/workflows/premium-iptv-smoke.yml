name: Premium IPTV browser smoke

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "watch.html"
      - "assets/data/manual-channel-overrides.json"
      - "assets/js/i18n.js"
      - "assets/js/iptv-auto.js"
      - "assets/js/iptv-window.js"
      - "assets/js/iptv-channel-resolver.js"
      - "assets/js/iptv-epg-match-core.js"
      - "assets/js/iptv-legacy-toggle-normalizer.js"
      - "assets/js/iptv-stage-copy.js"
      - "assets/js/iptv-premium-card-click.js"
      - "assets/js/watch-loader.js"
      - "assets/js/watch-xtream.js"
      - "backend/adapters/xtream-media-safe.js"
      - "backend/routes/xtream.js"
      - "tests/xtream-media-safe.test.js"
      - "tests/iptv-rollout-contract.test.js"
      - "scripts/diagnose-homepage.mjs"
      - "scripts/verify-iptv-stage-contract.mjs"
      - "scripts/verify-xtream-continuous.mjs"
      - ".github/workflows/premium-iptv-smoke.yml"
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated Playwright package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kz-playwright
          npm install --prefix /tmp/kz-playwright --no-save --ignore-scripts playwright@1.61.1
          rm -rf node_modules
          ln -s /tmp/kz-playwright/node_modules node_modules
      - name: Install Playwright browsers
        run: /tmp/kz-playwright/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Wait for Cloudflare Workers Build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            loader="$(curl -fsS "https://korazero.com/assets/js/watch-loader.js?v=${GITHUB_SHA}" 2>/dev/null || true)"
            bootstrap="$(curl -fsS "https://korazero.com/assets/js/i18n.js?v=${GITHUB_SHA}" 2>/dev/null || true)"
            normalizer="$(curl -fsS "https://korazero.com/assets/js/iptv-legacy-toggle-normalizer.js?v=${GITHUB_SHA}" 2>/dev/null || true)"
            auto="$(curl -fsS "https://korazero.com/assets/js/iptv-auto.js?v=${GITHUB_SHA}" 2>/dev/null || true)"
            clicker="$(curl -fsS "https://korazero.com/assets/js/iptv-premium-card-click.js?v=${GITHUB_SHA}" 2>/dev/null || true)"
            if grep -q 'watch-xtream.js?v=20260904continuous1' <<<"$loader" \
              && grep -q '20260904saudirollout2' <<<"$bootstrap" \
              && grep -q 'iptv-legacy-toggle-normalizer.js' <<<"$bootstrap" \
              && grep -q 'isLegacyPremiumHref' <<<"$normalizer" \
              && grep -q 'SUPPORTED_COMPETITIONS' <<<"$auto" \
              && grep -q 'T-30' <<<"$auto" \
              && grep -q '20260904cardclick4' <<<"$clicker"; then
              echo "Production has the deterministic T-30 IPTV rollout and unified card-stage normalizer."
              exit 0
            fi
            sleep 10
          done
          echo "Cloudflare production did not expose the expected deterministic IPTV rollout build." >&2
          exit 1
      - name: Diagnose homepage rendering
        run: node scripts/diagnose-homepage.mjs
      - name: Playwright unified card-stage verification
        run: node scripts/verify-iptv-stage-contract.mjs
      - name: Live Thmanyah catalog and continuous Xtream playback
        run: node scripts/verify-xtream-continuous.mjs
