name: Premium IPTV browser smoke

on:
  push:
    branches: [main]
    paths:
      - "watch.html"
      - "assets/js/i18n.js"
      - "assets/js/watch-loader.js"
      - "assets/js/watch-xtream.js"
      - "scripts/verify-premium-iptv.mjs"
      - ".github/workflows/premium-iptv-smoke.yml"
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Wait for Cloudflare Workers Build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            body="$(curl -fsS "https://korazero.com/assets/js/watch-loader.js?v=${GITHUB_SHA}" 2>/dev/null || true)"
            if grep -q 'watch-xtream.js?v=20260903premiumfix1' <<<"$body"; then
              echo "Production has the premium IPTV fix."
              exit 0
            fi
            sleep 10
          done
          echo "Cloudflare production did not expose the expected watch-loader build." >&2
          exit 1
      - name: Playwright premium IPTV verification
        run: node scripts/verify-premium-iptv.mjs
