name: ChatGPT one-shot KoraZero surface parity fix

on:
  push:
    branches:
      - chatgpt/20260905-0808-surface-parity

permissions:
  contents: write

concurrency:
  group: chatgpt-surface-parity-20260905
  cancel-in-progress: false

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply narrow watch-page-only parity fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          STAMP = "CHATGPT-STAMP 2026-09-05T08:08-04:00"

          watch = Path("assets/js/watch.js")
          s = watch.read_text()

          anchor = "  const labChannelCache = new Map();\n"
          assert s.count(anchor) == 1, "labChannelCache anchor changed; refusing broad/guessed edit"
          s = s.replace(anchor, f'''  // {STAMP} — WATCH-SURFACE-PARITY-1\n  // KoraZero's watch page refreshes plan metadata every 20s and fixtures every\n  // 90s. Those refreshes call loadPlayer(), but the IPTV Lab itself does not.\n  // Preserve an already-healthy Lab-backed player so metadata refreshes never\n  // destroy/recreate the video. This is watch-page lifecycle only: NO IPTV Lab\n  // source, player config, fallback, quality, or recovery logic is modified.\n  const labChannelCache = new Map();\n  let lastLabPlaybackKey = "";\n\n  function labChannelAlreadyHealthy(channelId) {{\n    if (!shell || !activeMpegTs || lastLabPlaybackKey !== channelId) return false;\n    const video = shell.querySelector(".kz-main-video");\n    return !!(video && video.readyState >= 2 && !video.error && !video.ended);\n  }}\n''', 1)

          anchor = "    const channelId = (match && match.channelId) || channel.id;\n    const info = await fetchLabChannel(channelId);\n"
          assert s.count(anchor) == 1, "mountLabChannel anchor changed; refusing guessed edit"
          s = s.replace(anchor, '''    const channelId = (match && match.channelId) || channel.id;\n    // CHATGPT-STAMP 2026-09-05T08:08-04:00 — the 20s/90s metadata ticks must\n    // not become playback ticks. Same channel + healthy media = leave it alone.\n    if (labChannelAlreadyHealthy(channelId)) return true;\n    const info = await fetchLabChannel(channelId);\n''', 1)

          anchor = "      labChannelCache.delete(channelId);\n      loadPlayer().catch(() => {});\n"
          assert s.count(anchor) == 1, "Lab error anchor changed; refusing guessed edit"
          s = s.replace(anchor, '''      lastLabPlaybackKey = "";\n      labChannelCache.delete(channelId);\n      loadPlayer().catch(() => {});\n''', 1)

          anchor = "    loadedUrl = `iptv-lab:${channelId}:${info.streamId}`;\n    applyWatchChrome();\n"
          assert s.count(anchor) == 1, "Lab success anchor changed; refusing guessed edit"
          s = s.replace(anchor, '''    loadedUrl = `iptv-lab:${channelId}:${info.streamId}`;\n    lastLabPlaybackKey = channelId;\n    applyWatchChrome();\n''', 1)
          watch.write_text(s)

          loader = Path("assets/js/watch-loader.js")
          s = loader.read_text()
          old = 'assets/js/watch.js?v=20260904noreload1'
          assert s.count(old) == 1, "watch-loader cache key changed"
          loader.write_text(s.replace(old, 'assets/js/watch.js?v=20260905chatgpt0808', 1))

          watch_html = Path("watch.html")
          s = watch_html.read_text()
          old = 'assets/js/watch-loader.js?v=20260905lab1'
          assert s.count(old) == 1, "watch.html loader cache key changed"
          watch_html.write_text(s.replace(old, 'assets/js/watch-loader.js?v=20260905chatgpt0808', 1))

          index = Path("index.html")
          s = index.read_text()
          old = 'assets/img/korazero-saudi.jpg?v=20260905live2'
          assert s.count(old) == 1, "Saudi hero cache key changed"
          index.write_text(s.replace(old, 'assets/img/korazero-saudi.jpg?v=20260905chatgpt0808', 1))
          PY

      - name: Prove IPTV Lab logic is untouched
        shell: bash
        run: |
          git diff --exit-code HEAD -- \
            assets/js/iptv-lab.js \
            assets/js/iptv-lab-compat-fallback.js \
            assets/js/iptv-quality.js \
            assets/js/mpegts-config.js \
            lib/mpegts-config.js
          echo "CHATGPT-STAMP 2026-09-05T08:08-04:00: IPTV Lab logic/config diff = ZERO"

      - name: Run repository checks
        run: |
          npm ci
          npm run lint
          npm test

      - name: Commit the reversible source fix and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git rm .github/workflows/chatgpt-surface-parity-20260905.yml
          git add assets/js/watch.js assets/js/watch-loader.js watch.html index.html
          git commit -m "CHATGPT-STAMP 2026-09-05T08:08-04:00: preserve healthy Lab stream on KoraZero"
          git push origin HEAD:chatgpt/20260905-0808-surface-parity

      - name: Deploy this exact tested branch to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "CHATGPT-STAMP 2026-09-05T08:08-04:00: deploying tested watch-surface-only patch"
          npx --yes wrangler@4 deploy
