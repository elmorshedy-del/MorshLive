# Automatic Saudi broadcast refresh — resumed.
#
# This was paused (SAUDI-BROADCAST-REFRESH-PAUSED-1) because the job appeared to
# push to main — and so rebuild production — endlessly. The real cause was a bug
# in refresh-saudi-broadcasts.js: `preservePreviousExact` appended a fresh
# `:pinned` suffix to `broadcast.source` on every pass, so `rowsChanged` reported
# a diff even when no channel assignment had moved. Pinning is idempotent now and
# the job commits only on a genuine change; see the regression test in
# tests/saudi-broadcast-refresh.test.js.
#
# Pausing it also froze `broadcastIndex`, which is the bug it was masking: with no
# refresh, every upcoming fixture decays to the generic `thmanyah` fallback, and
# KZIptvChannelResolver deliberately resolves nothing for an unnumbered channel.
# Saudi cards then open with no stream at all. This job is what keeps the exact
# ثمانية 1/2/3 assignments flowing, so leaving it paused breaks Saudi playback.
#
# Playback code is protected independently by the stream lock
# (scripts/verify-stream-lock.mjs), which runs before and after the Cloudflare
# refresh build and refuses the deploy on any drift. This job writes only
# assets/data/today.json, which the lock does not cover and does not need to.
name: Update Saudi broadcast channels

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/broadcast-registry.js"
      - "scripts/commentators-lib.js"
      - "scripts/refresh-saudi-broadcasts.js"
      - "scripts/saudi-tv-guide-lib.js"
      - "tests/saudi-broadcast.test.js"
      - "tests/saudi-broadcast-refresh.test.js"
      - "tests/saudi-tv-guide.test.js"
      - ".github/workflows/update-saudi-broadcasts.yml"

permissions:
  contents: write

concurrency:
  group: update-saudi-broadcasts
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh Saudi channel assignments
        run: node scripts/refresh-saudi-broadcasts.js

      - name: Commit only meaningful broadcast changes
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/data/today.json; then
            echo "Saudi broadcast assignments unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/today.json
          git commit -m "chore: refresh Saudi broadcast channels"
          git pull --rebase origin main
          git push origin HEAD:main
