# CHATGPT-STAMP 2026-09-06 — SAUDI-BROADCAST-REFRESH-PAUSED-1
#
# Temporarily pause the automatic Saudi broadcast refresh while production
# streaming stability is being isolated. Scheduled and push-triggered runs are
# disabled. Manual workflow_dispatch is retained for an explicit operator test.
#
# Rollback: restore the previous `on:` schedule/push triggers from rollback
# snapshot 34a206c2f3e9f0e486aa2cafffa3b6c94be56b82.
name: Update Saudi broadcast channels

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-saudi-broadcasts
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh Saudi channel assignments
        run: node scripts/refresh-saudi-broadcasts.js

      - name: Commit only meaningful broadcast changes
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/data/today.json; then
            echo "Saudi broadcast assignments unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/today.json
          git commit -m "chore: refresh Saudi broadcast channels"
          git pull --rebase origin main
          git push origin HEAD:main
