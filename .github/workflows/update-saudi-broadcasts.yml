name: Update Saudi broadcast channels

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/broadcast-registry.js"
      - "scripts/commentators-lib.js"
      - "scripts/refresh-saudi-broadcasts.js"
      - "tests/saudi-broadcast.test.js"
      - "tests/saudi-broadcast-refresh.test.js"
      - ".github/workflows/update-saudi-broadcasts.yml"

permissions:
  contents: write

concurrency:
  group: update-saudi-broadcasts
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Inspect exact Saudi TV guide markup
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -A 'Mozilla/5.0' 'https://www.livefootballtv.info/competition/liga-profesional-saudi' -o /tmp/saudi-tv.html
          echo "guide_bytes=$(wc -c < /tmp/saudi-tv.html)"
          grep -n -E -m 8 -B 3 -A 8 'Thmanyah [123] HD|thmanyah-[123]-hd' /tmp/saudi-tv.html || true

      - name: Refresh Saudi channel assignments
        run: node scripts/refresh-saudi-broadcasts.js

      - name: Commit only meaningful broadcast changes
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/data/today.json; then
            echo "Saudi broadcast assignments unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/today.json
          git commit -m "chore: refresh Saudi broadcast channels"
          git pull --rebase origin main
          git push origin HEAD:main
