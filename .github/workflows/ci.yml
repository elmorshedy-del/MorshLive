name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  deploy-production:
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set Cloudflare credentials
        env:
          SECRET_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SECRET_TOKEN5: ${{ secrets.CLOUDFLARE_TOKEN5 }}
          SECRET_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TOKEN="${SECRET_TOKEN:-${SECRET_TOKEN5:-}}"
          TOKEN="${TOKEN// /}"
          if [ -z "$TOKEN" ]; then
            echo "::error::No Cloudflare deploy token is configured in GitHub secrets."
            exit 1
          fi
          if [ -z "${SECRET_ACCOUNT:-}" ]; then
            echo "::error::No CLOUDFLARE_ACCOUNT_ID is configured in GitHub secrets."
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$SECRET_ACCOUNT" >> "$GITHUB_ENV"
      - name: Verify token can deploy Worker
        run: node scripts/verify-deploy-token.js
      - name: Deploy morshlive Worker
        run: npx --yes wrangler@4 deploy
